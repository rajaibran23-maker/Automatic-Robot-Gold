
name: Build GridBot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

    
      - 
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check ZIP file
        run: test -f GridBot_MT5_Project_Source_Updated.zip

      - name: Unpack project ZIP
        run: unzip -q GridBot_MT5_Project_Source_Updated.zip -d source

      - name: Find Android project
        run: |
          APP_GRADLE=$(find source -type f -path '*/app/build.gradle' -print -quit)
          if [ -z "$APP_GRADLE" ]; then
            echo "Android build.gradle not found"
            find source -maxdepth 6 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GridBot-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
